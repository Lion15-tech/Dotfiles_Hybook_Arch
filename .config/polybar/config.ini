[colors]
background = #0b0e14
background-alt = #1a1d24
foreground = #e0e6f0
primary = #ff0055
secondary = #00f0ff
alert = #ffee00
good = #00ff66
disabled = #555555

[bar/main]
width = 100%
height = 26pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
border-bottom-size = 2pt
border-bottom-color = ${colors.primary}
padding-left = 1
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.primary}
font-0 = "JetBrainsMono Nerd Font:size=10;2"
modules-left = i3 xwindow
modules-right = pulseaudio backlight memory cpu wlan battery date tray
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = #ffffff
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-padding = 2
label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.secondary}

[module/pulseaudio]
type = internal/pulseaudio
label-volume = VOL %percentage%%
label-muted = MUTED
label-muted-foreground = ${colors.disabled}

[module/backlight]
type = internal/backlight
use-actual-brightness = true
label = BRI %percentage%%

[module/memory]
type = internal/memory
interval = 3
label = RAM %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0
label-connected = %{F#00ff66}WIFI%{F-} %essid%
label-disconnected = %{F#ff0055}OFFLINE%{F-}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
label-charging = %{F#00f0ff}CHG%{F-} %percentage%%
label-discharging = %{F#00ff66}BAT%{F-} %percentage%%
label-full = %{F#00ff66}FULL%{F-} %percentage%%

[module/date]
type = internal/date
interval = 5
date = %a %d/%m
time = %H:%M
label = %date% %time%
label-foreground = ${colors.secondary}

[module/tray]
type = internal/tray
tray-spacing = 6pt
