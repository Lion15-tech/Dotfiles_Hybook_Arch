<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hybook Arch // Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="cyber-canvas"></canvas>

  <header class="top-hud">
    <div class="sys-tag"><span class="dot"></span> HYBOOK-ARCH // NETRUNNER OS</div>
    <div id="clock" class="clock">00:00:00</div>
    <div class="power-controls">
      <button type="button" id="btn-reboot" title="Reiniciar">↻ REINICIAR</button>
      <button type="button" id="btn-shutdown" title="Apagar">⏻ APAGAR</button>
    </div>
  </header>

  <main class="login-wrapper">
    <section id="hud-panel" class="hud-panel">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="panel-header">
        <span class="badge">ACCESO RESTRINGIDO</span>
        <h1>ARCH LINUX</h1>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="field-group">
          <label for="user-select">USUARIO</label>
          <select id="user-select"></select>
        </div>

        <div class="field-group">
          <label for="session-select">ENTORNO</label>
          <select id="session-select"></select>
        </div>

        <div class="field-group">
          <label for="password-input">CLAVE DE ACCESO</label>
          <input type="password" id="password-input" placeholder="••••••••••••" autofocus required />
        </div>

        <button type="submit" id="btn-login">INICIAR SESIÓN ❯</button>
      </form>

      <div id="status-msg" class="status">ESPERANDO CREDENCIALES...</div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
